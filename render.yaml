# Render Blueprint: the API as a Docker web service and the web app as a static site.
# The static site proxies /api/* to the API, so the browser sees a single origin and the
# session cookie stays first-party. Postgres lives outside Render (e.g. Neon): set DATABASE_URL.
#
# If Render gives a service a different onrender.com host than its name, update
# WEB_ORIGIN, PUBLIC_API_URL and the /api/* rewrite below to match.
services:
  - type: web
    name: uplift-api
    runtime: docker
    plan: free
    # Close to Europe-based users; keep the database (e.g. Neon eu-central-1) in the same area.
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - Dockerfile
        - pnpm-lock.yaml
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        value: https://uplift-web.onrender.com
      - key: PUBLIC_API_URL
        value: https://uplift-api.onrender.com
      # The free instance has 512 MB: one page render at a time and a capped heap.
      - key: RENDER_CONCURRENCY
        value: '1'
      - key: NODE_OPTIONS
        value: --max-old-space-size=256

  - type: web
    name: uplift-web
    runtime: static
    buildCommand: >-
      npx -y pnpm@12.6.0 install --frozen-lockfile --filter web... &&
      npx -y pnpm@12.6.0 --filter @uplift/shared build &&
      npx -y pnpm@12.6.0 --filter web build
    staticPublishPath: apps/web/dist
    buildFilter:
      paths:
        - apps/web/**
        - packages/shared/**
        - pnpm-lock.yaml
    envVars:
      - key: NODE_VERSION
        value: '24'
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /api/*
        destination: https://uplift-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
